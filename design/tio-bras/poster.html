<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#f3ead3;font-family:'Abril Fatface',serif;color:#0b1f4d;overflow:hidden;position:relative}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 52%,#efe1bf 0 6deg,#f3ead3 6deg 12deg)}
.frame{position:absolute;inset:28px;border:6px solid #0b1f4d;outline:2px solid #0b1f4d;outline-offset:-18px}
.top{position:absolute;top:70px;width:100%;text-align:center;font-size:118px;letter-spacing:2px;line-height:1}
.top span{color:#009c3b}
.fig{position:absolute;left:50%;top:150px;width:760px;transform:translateX(-50%)}
.band{position:absolute;bottom:46px;left:46px;right:46px;height:280px;background:#0b1f4d;color:#fff;text-align:center;padding-top:30px;border-top:10px solid #ffdf00}
.big{font-size:132px;line-height:1;color:#ffdf00;letter-spacing:3px}
.sub{font-family:'Newsreader',serif;font-style:italic;font-size:50px;margin-top:10px}
.url{position:absolute;bottom:22px;width:100%;font-family:system-ui;font-size:20px;letter-spacing:4px;opacity:.7}
.flag{position:absolute;left:0;right:0;height:14px;background:linear-gradient(90deg,#009c3b 0 33%,#ffdf00 33% 66%,#009c3b 66%)}
</style></head><body>
<div class="rays"></div>
<div class="top">O TIO <span>BRÁS</span></div>
<img class="fig" src="figure.svg">
<div class="band">
<div class="big">QUER VOCÊ</div>
<div class="sub">para consertar o Brasil.gov</div>
<div class="url">GITHUB.COM/SIBELIUS/BRASIL-GOV</div></div>
<div class="frame"></div>
</body></html>
